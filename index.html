<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--ink:#2b2250;--gold:#ffc83d;--pur:#7b5cff;--sky:#58c4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#58c4ff}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#58c4ff,#a8e6ff 55%,#8ee06a 55%,#5cc044)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:stretch;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);max-width:720px;margin:0 auto}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.outline{color:#fff;text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 4px 0 var(--ink)}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;flex:none}
.topbar .grow{flex:1;min-width:0}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:middle}
.gear{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #5a3fb8;display:flex;align-items:center;justify-content:center;flex:none;pointer-events:auto}
.gear .ic{width:34px;height:34px}
.btn{min-height:56px;padding:10px 20px;border-radius:20px;font-weight:900;font-size:22px;color:#fff;background:var(--pur);box-shadow:0 6px 0 #4a2fb5;text-shadow:0 2px 0 rgba(0,0,0,.25);display:inline-flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4a2fb5}
.btn.go{background:#2fbf4a;box-shadow:0 7px 0 #1c8a31}.btn.go:active{box-shadow:0 2px 0 #1c8a31}
.btn.blue{background:#2f8cff;box-shadow:0 6px 0 #1b5fc2}
.btn.orange{background:#ff8a1f;box-shadow:0 6px 0 #b85a00}
.btn.red{background:#ff4f6e;box-shadow:0 6px 0 #b8284a}
.btn.big{min-height:78px;font-size:34px;border-radius:26px;padding:12px 34px}
.btn.small{min-height:48px;font-size:18px;padding:8px 14px;border-radius:16px}
.btn[disabled]{filter:grayscale(.8);opacity:.6}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.chip small{font-size:13px;opacity:.7;font-weight:800}
.chip.gold{background:#fff3c4;border:3px solid var(--ink)}
/* ---------- title ---------- */
#s-title{align-items:center;text-align:center}
.logo{font-family:"Arial Black","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:900;line-height:.95;font-size:clamp(38px,12.5vw,70px);margin-top:2px}
.logo span{display:inline-block;animation:wavy 1.4s ease-in-out infinite alternate}
@keyframes wavy{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-6px) rotate(2deg)}}
.logo .l2{display:block;color:#ffe23d}
.hero-wrap{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.hero-wrap .hv{height:min(100%,330px);aspect-ratio:120/190;position:relative;animation:hop 1.1s ease-in-out infinite}
.hv svg,#hero svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes hop{0%,55%,100%{transform:translateY(0)}78%{transform:translateY(-18%)}}
.hero-wrap .arc{position:absolute;left:50%;top:50%;width:min(90%,340px);transform:translate(-50%,-52%);pointer-events:none}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px;flex:none}
.title-btns{display:flex;gap:10px;margin-top:10px;flex:none;width:100%;justify-content:center}
.title-btns .btn{flex:1;max-width:190px}
.next-hint{margin-top:6px;font-weight:900;font-size:16px;background:rgba(255,255,255,.85);border-radius:14px;padding:4px 12px;flex:none}
/* ---------- run ---------- */
#s-run{padding:0;max-width:none;background:#58c4ff}
#s-run canvas{position:absolute;inset:0;width:100%;height:100%}
#cv-bg{z-index:1}#cv-fx{z-index:3;pointer-events:none}
#hero{position:absolute;z-index:2;pointer-events:none;will-change:transform}
#hero .sv{transform-origin:50% 100%}
#hero.stumble .sv{animation:stumble 1.3s ease-in-out forwards}
@keyframes stumble{0%{transform:none}20%{transform:rotate(-14deg) scale(1.06,.9)}45%{transform:rotate(18deg) translateY(4%)}70%{transform:rotate(-720deg) scale(.9)}100%{transform:rotate(-720deg) scale(1)}}
#hero.tuck .sv-legs{transform:translateY(-6px)}
#hero.tuck .sv-armL{transform:rotate(-14deg);transform-origin:31px 100px}#hero.tuck .sv-armR{transform:rotate(14deg);transform-origin:89px 100px}
#hero.squash .sv{animation:squash .22s ease-out}
@keyframes squash{0%{transform:scale(1.18,.8)}100%{transform:none}}
#hshadow{position:absolute;z-index:2;pointer-events:none;border-radius:50%;background:rgba(0,0,0,.28)}
#stage{position:absolute;inset:0;z-index:4}
#hud{position:absolute;inset:0;z-index:5;pointer-events:none;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) calc(var(--sab) + 12px) calc(var(--sal) + 10px);display:flex;flex-direction:column;justify-content:flex-start}
.hud-top{display:flex;align-items:flex-start;gap:8px}
.hud-top .mid{flex:1;text-align:center;min-width:0}
.streak-lbl{font-weight:900;font-size:15px;letter-spacing:2px}
#streak{font-family:"Arial Black",system-ui,sans-serif;font-weight:900;font-size:clamp(56px,19vw,96px);line-height:.95;display:inline-block}
#streak.pop{animation:spop .28s cubic-bezier(.2,1.8,.5,1)}
@keyframes spop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.hud-sub{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.mbar{height:12px;border-radius:8px;background:rgba(0,0,0,.28);width:min(78%,300px);margin:6px auto 0;overflow:hidden;border:2px solid rgba(255,255,255,.8)}
.mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23d,#ff8a1f)}
#nextlbl{font-weight:900;font-size:13px;margin-top:2px}
.shields{display:flex;gap:2px;justify-content:center;min-height:26px;margin-top:2px}
.shields .ic{width:26px;height:26px}
.hud-bot{display:flex;align-items:flex-end;gap:8px;margin-top:auto}

function loadProfile(){

    ['coins','best','life','runs'].forEach(function(k){if(typeof s[k]==='number'&&isFinite(s[k]))P[k]=s[k]});

    if(s.own)['hat','rope','outfit'].forEach(function(g){if(s.own[g])for(var id in s.own[g])P.own[g][id]=1});

function stats(){
  var u=P.up,bo=has('bouncy'),ro=has('rocket');

var mathSeen={};
function mathQ(level){
  for(var tries=0;tries<60;tries++){
    var q=mathOnce(level);if(!mathSeen[q.t]){mathSeen[q.t]=1;return q}
  }
  mathSeen={};return mathOnce(level);
}
function mathOnce(level){
  var L=Math.min(level,5),a,b,c,ans,t,kind=rnd(L<1?2:L<2?3:L<3?4:5);
  if(kind===0){a=1+rnd(L<1?12:9);b=1+rnd(L<1?12:9);ans=a+b;t=a+' + '+b+' = ?'}
  else if(kind===1){a=8+rnd(L<1?12:30);b=1+rnd(Math.min(9,a-1));ans=a-b;t=a+' \u2212 '+b+' = ?'}
  else if(kind===2){a=10+rnd(60);b=10+rnd(Math.min(40,99-a));if(a+b>99)b=99-a;ans=a+b;t=a+' + '+b+' = ?'}
  else if(kind===3){a=[2,5,10,3,4][rnd(L<3?3:5)];b=2+rnd(L<3?6:9);ans=a*b;t=a+' \u00D7 '+b+' = ?'}
  else{ // missing number or two-step
    if(rnd(2)){a=2+rnd(8);b=a*(2+rnd(L<4?4:8));ans=b/a;t=b+' \u00F7 '+a+' = ?'}
    else{a=20+rnd(50);b=5+rnd(20);c=2+rnd(8);ans=a+b-c;t=a+' + '+b+' \u2212 '+c+' = ?'}
  }
  var ds={};ds[ans]=1;var ch=[ans],offs=shuffle([1,-1,2,-2,10,-10,3,5,-5]);
  for(var i=0;i<offs.length&&ch.length<3;i++){var d=ans+offs[i];if(d>=0&&!ds[d]){ds[d]=1;ch.push(d)}}
  while(ch.length<3){var d2=ans+ch.length+rnd(6);if(!ds[d2]){ds[d2]=1;ch.push(d2)}}
  return{t:t,ans:ans,choices:shuffle(ch)};
}

function rollDraft(streak,force){
  if(force)return force.map(function(id){return{id:id}});
  var d=Math.min(1,Math.log10(1+streak)/3),pool=BOOSTS.slice(),out=[];
  var wt={common:Math.max(20,62-30*d),rare:26+8*d,epic:9+14*d,legendary:3+6*d};
  for(var k=0;k<3&&pool.length;k++){
    var tot=0;pool.forEach(function(b){tot+=wt[b.r]});
    var x=Math.random()*tot,ch=pool.length-1;
    for(var i=0;i<pool.length;i++){x-=wt[pool[i].r];if(x<=0){ch=i;break}}
    out.push({id:pool[ch].id});pool.splice(ch,1);
  }
  return out;
}

/* ===== ENGINE: rope timing, jump physics, streak/progression, effects, stumble ===== */
var G={phase:'idle',T:0,streak:0,runCoins:0,shields:0,autoCh:0,autoLeft:0,y:0,vy:0,air:false,hopped:false,buf:-9,crosses:[],last:0,beatN:0,sinceDbl:0,
  face:'happy',stumbleT:0,newBest:false,unl:[],paused:false,botOn:false,worldK:0,tw:0,coinsSaved:0,lastWhoosh:-1,mathCount:0,mathLevel:0,frozen:false,cueAt:-9,pendingMath:false,skipsThisRun:0,milesQ:[],
  purse:0,banked:0,rb:{},tmp:{},slowLeft:0,buys:0,rerolls:0,draft:[],picked:false,draftNew:false,counting:false,pendDraft:false,cdId:0,lostList:[],botShop:false};

function layout(){
  if(!cvBg)return;
  var app=$('#s-run'),W=app.clientWidth||innerWidth,H=app.clientHeight||innerHeight,dpr=Math.min(2,window.devicePixelRatio||1);

  [cvBg,cvFx].forEach(function(c){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)});
  var sab=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab'))||0;
  var botUI=sab+12+92+10+34;
  L.gy=Math.round(H-botUI-(H<620?0:6));

function placeHero(){
  heroEl.style.transform='translateY('+(-G.y*L.ch)+'px)';
  var k=1-0.35*clamp(G.y/0.5,0,1);
  shadowEl.style.width=(L.cw*0.72*k)+'px';shadowEl.style.height=(L.ch*0.07)+'px';shadowEl.style.left=(L.cx-L.cw*0.36*k)+'px';shadowEl.style.top=(L.gy-L.ch*0.025)+'px';shadowEl.style.opacity=String(0.3+0.4*(1-clamp(G.y/0.5,0,1)));

}
function ropeSpec(){return ROPES[P.eq.rope]||ROPES.classic}

/* ---- rope schedule ---- */
function tempo(s){return 0.74+(1.36-0.74)*Math.exp(-s/90)}
function genNext(prevT,projStreak,st){
  var beat=G.beatN++,base=tempo(projStreak)*st.ropeSlow,type='n';
  if(projStreak>=30)base*=1+0.10*Math.sin(beat*0.8);
  if(projStreak>=150)base*=(Math.floor(beat/6)%2?0.9:1.05);
  base=Math.max(base,st.H+0.14);
  G.sinceDbl++;
  if(projStreak>=60&&G.sinceDbl>=7+rnd(6)){
    G.sinceDbl=0;
    var a={t:prevT+base,type:'d1',ok:false,auto:false},b={t:a.t+st.H+0.1,type:'d2',ok:false,auto:false};
    return [a,b];
  }
  if(projStreak>=100&&Math.random()<0.12){base*=1.3;type='x'}
  return [{t:prevT+base,type:type,ok:false,auto:false}];
}
function fillQueue(){
  var st=stats();
  while(G.crosses.length<3){
    var prev=G.crosses.length?G.crosses[G.crosses.length-1].t:G.last;
    var proj=G.streak+G.crosses.length;
    var arr=genNext(prev,proj,st);
    arr.forEach(function(c){G.crosses.push(c);if(c.type==='d1')banner('DOUBLE!','jump, jump!','#ffe23d',1100);if(c.type==='x')banner('CRISS-CROSS!','the rope waits a beat','#7ee8ff',1100)});
  }
}

function requeue(){
  var keep=G.crosses.length?1:0;if(keep&&G.crosses[0].type==='d1')keep=2;
  G.crosses.length=Math.min(G.crosses.length,keep);fillQueue();
}

/* ---- run purse + in-run shop (roguelike boosts) ---- */
function addPurse(n){G.purse+=n;G.runCoins+=n;if(G.purse>1e300)G.purse=1e300}
function syncPause(){G.paused=!!(G.counting||document.querySelector('.modal.on'))}
function openShop(){
  if(G.phase!=='run'||SCREEN!=='run')return;
  G.counting=false;G.cdId++;$('#count').className='';
  G.draftNew=false;runShopRender();$('#shopm').classList.add('on');syncPause();Snd.play('ui');hudUpdate();
}
function closeShop(){
  $('#shopm').classList.remove('on');
  if(G.phase!=='run'){syncPause();return}
  startCountdown();
}
function startCountdown(){
  G.counting=true;syncPause();var n=3,id=++G.cdId,el=$('#count');
  function step(){
    if(!G.counting||id!==G.cdId)return;
    if(n>0){el.textContent=n;el.className='';void el.offsetWidth;el.className='show';Snd.play('tick');n--;setTimeout(step,700/TS)}
    else{
      el.textContent='GO!';el.className='';void el.offsetWidth;el.className='show go';Snd.play('go');
      var c0=G.crosses[0];if(c0){var gap=c0.t-G.T;if(gap<1.25){var sh=1.25-gap;G.crosses.forEach(function(c){c.t+=sh;c.bot=false;c.auto=false});G.last+=sh}}
      G.buf=-9;G.counting=false;syncPause();
    }
  }
  step();
}
function boostCount(){var n=0;for(var k in G.rb)n+=G.rb[k];return n}
function applyBoost(id){
  if(id==='shield')G.shields++;
  else if(id==='autoc')G.autoCh++;
  else if(id==='heartx')G.shields+=3;
  else G.rb[id]=(G.rb[id]||0)+1;
  if(id==='slow'){G.slowLeft=3+G.rb.slow;requeue()}
  var r=BOOSTBY[id].r;
  sparkleBurst(L.cx,L.gy-L.ch*.5,r==='legendary'?40:r==='epic'?28:16,r==='legendary'?['#ffd23d','#fff','#ff8a1f']:['#7ee8ff','#fff','#ffe23d']);
  if(r==='legendary'||r==='epic')confetti(r==='legendary'?80:40);
}
function pickDraft(i){
  var o=G.draft[i];if(!o||G.picked||G.phase!=='run')return false;
  var pr=boostPrice(o.id,G.streak,G.buys);
  if(G.purse<pr){Snd.play('no');toast('Need '+fmt(pr-G.purse)+' more coins!');return false}
  G.purse-=pr;G.buys++;G.picked=true;o.taken=true;applyBoost(o.id);
  Snd.play('buy');toast('Got '+BOOSTBY[o.id].name+'!');hudUpdate();runShopRender();return true;
}
function buyNow(id){
  if(G.phase!=='run')return false;
  var pr=buyNowPrice(id,G.streak,G.buys);
  if(G.purse<pr){Snd.play('no');toast('Need '+fmt(pr-G.purse)+' more coins!');return false}
  G.purse-=pr;G.buys++;
  if(id==='b_shield')G.shields++;
  else if(id==='b_coin')G.tmp.coin=(G.tmp.coin||0)+TEMP_SKIPS;
  else if(id==='b_win')G.tmp.win=(G.tmp.win||0)+TEMP_SKIPS;
  else if(id==='b_auto')G.autoCh++;
  sparkleBurst(L.cx,L.gy-L.ch*.5,14,['#7ee8ff','#fff','#ffe23d']);
  Snd.play('buy');toast(BUYBY[id].name+'!');hudUpdate();runShopRender();return true;
}
function rerollDraft(){
  if(G.phase!=='run')return false;

/* ---- run control ---- */
function newRunState(){

  G.purse=0;G.banked=0;G.rb={};G.tmp={};G.slowLeft=0;G.buys=0;G.rerolls=0;G.draft=rollDraft(0);G.picked=false;G.draftNew=false;G.counting=false;G.pendDraft=false;G.cdId++;G.lostList=[];
  G.beatN=0;G.sinceDbl=0;G.newBest=false;G.unl=[];G.milesQ=[];G.skipsThisRun=0;G.worldK=0;G.stumbleT=0;G.lastWhoosh=-1;G.pendingMath=false;
  var first=2.4;G.last=first-1.35;G.crosses=[{t:first,type:'n',ok:false,auto:false}];

}

function doJump(){

function physics(dt){

/* ---- particles ---- */
function sparkleBurst(x,y,n,cols){for(var i=0;i<n;i++){var a=rr(0,6.28),s=rr(60,220);parts.push({k:'s',x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:rr(.4,.8),t:0,c:pick(cols),r:rr(3,6)})}}
function confetti(n){for(var i=0;i<n;i++){parts.push({k:'c',x:rr(0,L.W),y:rr(-40,L.H*.2),vx:rr(-60,60),vy:rr(80,260),life:rr(1.4,2.6),t:0,c:pick(['#ff4f6e','#ffd23d','#2fb8ff','#46c85a','#a56bff','#ff8a1f']),w:rr(6,11),h:rr(8,16),rot:rr(0,6),vr:rr(-8,8)})}}
function floatText(txt,x,y,col,size){parts.push({k:'t',x:x,y:y,vx:0,vy:-80,life:.9,t:0,txt:txt,c:col||'#fff',size:size||26})}
function coinFly(x,y){parts.push({k:'m',x:x,y:y,vx:rr(-40,40),vy:rr(-120,-40),life:.7,t:0})}
function drawParts(dt){
  var c=cfx;
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}
    var a=1-p.t/p.life;
    if(p.k==='c'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=Math.min(1,a*2);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()}
    else if(p.k==='s'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;c.globalAlpha=a;c.fillStyle=p.c;c.beginPath();var r=p.r*(0.5+a);for(var j=0;j<4;j++){var an=j*1.5708+p.t*4;c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(an)*r*1.8,p.y+Math.sin(an)*r*1.8);c.lineTo(p.x+Math.cos(an+.5)*r*.6,p.y+Math.sin(an+.5)*r*.6)}c.fill();c.globalAlpha=1}
    else if(p.k==='t'){p.y+=p.vy*dt;c.globalAlpha=Math.min(1,a*2);c.font='900 '+p.size+'px "Arial Black",system-ui,sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='#2b2250';c.strokeText(p.txt,p.x,p.y);c.fillStyle=p.c;c.fillText(p.txt,p.x,p.y);c.globalAlpha=1}
    else if(p.k==='m'){ // coin flies toward the coin chip
      var k=p.t/p.life,tx=36,ty=36+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0);
      var x=lerp(p.x+p.vx*p.t,tx,k*k),y=lerp(p.y+p.vy*p.t,ty,k*k);c.fillStyle='#ffc83d';c.strokeStyle='#2b2250';c.lineWidth=2;c.beginPath();c.arc(x,y,7,0,7);c.fill();c.stroke();
    }
  }
  c.globalAlpha=1;
}

/* ---- rope drawing ---- */
function ropeCurve(c,hx0,hy,hx1,mid,flare){ // cubic through hand points with the midpoint at "mid"
  var y1=(8*mid-2*hy)/6;
  return [hx0,hy,hx0-flare,y1,hx1+flare,y1,hx1,hy];
}
function bez(b,t){var u=1-t,a=u*u*u,bb=3*u*u*t,cc=3*u*t*t,d=t*t*t;return[a*b[0]+bb*b[2]+cc*b[4]+d*b[6],a*b[1]+bb*b[3]+cc*b[5]+d*b[7]]}
function strokeRope(c,b,w,spec,time){
  c.lineCap='round';c.lineJoin='round';
  function path(){c.beginPath();c.moveTo(b[0],b[1]);c.bezierCurveTo(b[2],b[3],b[4],b[5],b[6],b[7])}
  if(spec.glow){c.shadowColor=spec.glow;c.shadowBlur=12}
  if(spec.multi){var N=26;c.shadowBlur=0;for(var i=0;i<N;i++){var p0=bez(b,i/N),p1=bez(b,(i+1.2)/N);c.strokeStyle=spec.col[Math.floor(i/N*6+time*3)%6];c.lineWidth=w;c.beginPath();c.moveTo(p0[0],p0[1]);c.lineTo(p1[0],p1[1]);c.stroke()}return}
  path();c.strokeStyle=spec.col[0];c.lineWidth=w;c.stroke();
  if(spec.dash){c.shadowBlur=0;path();c.strokeStyle=spec.col[1];c.setLineDash([w*1.2,w*1.2]);c.lineWidth=w;c.stroke();c.setLineDash([])}
  else if(spec.col[1]){c.shadowBlur=0;path();c.strokeStyle=spec.col[1];c.lineWidth=w*.45;c.stroke()}
  c.shadowBlur=0;
}
function ropeState(){
  var c0=G.crosses[0],span=Math.max(0.2,c0.t-G.last),k=clamp((G.T-G.last)/span,0,1);
  return Math.PI+2*Math.PI*k; // pi (bottom, just passed) .. 3pi (bottom, passing)
}
function render(dt){
  var W=L.W,H=L.H,d=L.dpr,time=G.T;
  cbg.setTransform(d,0,0,d,0,0);cfx.setTransform(d,0,0,d,0,0);
  var wk=G.worldK;drawWorld(cbg,W,H,L.gy,wk,time);
  cfx.clearRect(0,0,W,H);
  var spec=ropeSpec(),sc=L.ch/260;
  var handY=L.gy-L.ch*(186-143)/190-G.y*L.ch,hx0=L.cx-L.cw*(60-20)/120,hx1=L.cx+L.cw*(100-60)/120;
  var phi=Math.PI,limp=G.phase==='stumble'||G.phase==='over';
  if(G.crosses.length&&!limp)phi=ropeState();
  var cyc=((phi%(2*Math.PI))+2*Math.PI)%(2*Math.PI); // 0 top .. pi bottom
  var front=Math.sin(phi)>0&&!limp;
  var A=L.ch*0.56,c0=L.gy-L.ch*0.56;
  var mid=limp?(L.gy-3):(c0-A*Math.cos(phi)*-1*-1); // placeholder replaced below
  mid=limp?(L.gy-3):(c0-A*Math.cos(phi));
  // at phi=pi: c0 + A = gy ... cos(pi)=-1 => c0 - A*(-1) = c0 + A = gy  OK
  var flare=L.cw*(0.55+0.25*Math.abs(Math.sin(phi)));
  var b=ropeCurve(cbg,hx0,handY,hx1,mid,flare);
  if(limp){ // lazy rope on the floor
    var wig=G.phase==='stumble'?Math.sin(G.stumbleT*10)*6*sc:0;
    b=[hx0,handY,hx0-L.cw*.7,L.gy-4+wig,hx1+L.cw*.9,L.gy-8-wig,hx1+L.cw*.2,L.gy-2];
  }
  // shadow telegraph on the ground: grows darker as the rope comes down
  var near=limp?0:clamp(-Math.cos(phi),0,1);
  if(!limp){cbg.fillStyle='rgba(0,0,0,'+(0.05+0.3*near*near)+')';cbg.beginPath();cbg.ellipse(L.cx,L.gy+4*sc,L.cw*(0.9+0.4*near),9*sc*(0.6+near),0,0,7);cbg.fill()}
  // rope: behind canvas or front canvas
  var w=(front?7:5)*sc;
  strokeRope(front||limp?cfx:cbg,b,Math.max(3,w),spec,time);
  // cue ring: "tap now"
  if(G.phase==='run'&&!G.air&&G.autoLeft<=0){
    var c=null;for(var i=0;i<G.crosses.length;i++)if(!G.crosses[i].ok){c=G.crosses[i];break}
    if(c){
      var st=stats(),opt=c.t-st.H/2-G.T,q=1-Math.abs(opt)/0.22;
      if(q>0){cfx.strokeStyle='rgba(255,226,61,'+(0.25+0.75*q)+')';cfx.lineWidth=(4+4*q)*sc;cfx.beginPath();cfx.ellipse(L.cx,L.gy+2*sc,L.cw*(0.7+0.5*(1-q)),L.ch*0.07*(1+(1-q)),0,0,7);cfx.stroke()}
      if(q>0.55&&!G.cueFired){G.cueFired=true;var jb=$('#jumpbtn');jb.classList.remove('cue');void jb.offsetWidth;jb.classList.add('cue')}
      if(q<=0)G.cueFired=false;
    }
  }
  if(spec.spark&&Math.random()<.35&&!limp){var p=bez(b,Math.random());parts.push({k:'s',x:p[0],y:p[1],vx:rr(-20,20),vy:rr(-30,10),life:.4,t:0,c:'#fff',r:3})}
  // star magnet: little stars drift to you
  drawParts(dt);
}

/* ---- main update ---- */
function resolveCross(c){
  G.crosses.shift();G.last=c.t;fillQueue();
  if(c.ok){onSkip(c)}
  else if(G.shields>0){
    G.shields--;Snd.play('shield');banner('Second Chance!','shield used - keep going!','#7ee8ff',1000);sparkleBurst(L.cx,L.gy-L.ch*.4,18,['#7ee8ff','#fff']);hudUpdate();
  }else if(rbN('saver')>0){
    G.rb.saver--;if(G.rb.saver<=0)delete G.rb.saver;
    G.streak=Math.max(0,Math.ceil(G.streak/2));G.worldK=worldIdx(G.streak);
    Snd.play('shield');banner('Streak Saved!','kept half - keep going!','#ff8fb1',1300);sparkleBurst(L.cx,L.gy-L.ch*.4,22,['#ff8fb1','#fff']);hudUpdate();
  }else stumble();
}
function onSkip(c){
  G.streak++;G.skipsThisRun++;P.life++;
  var s=G.streak;
  var gain=coinsPerSkip(s);addPurse(gain);
  var sx=L.cx,sy=L.gy-L.ch*1.08-G.y*L.ch;
  floatText('+'+fmt(gain),sx+rr(-30,30),sy,'#ffe23d',24+Math.min(14,String(gain).length*1.5));
  if(stats().perkCoin>=1.5||rbN('magnet')||tmpN('coin')>0){for(var i=0;i<3;i++)coinFly(sx+rr(-40,40),sy+rr(0,40))}
  // timed boosts count down (in skips)
  ['coin','win'].forEach(function(k){if(G.tmp[k]>0){G.tmp[k]--;if(G.tmp[k]<=0){delete G.tmp[k];toast(k==='coin'?'Coin Boost ended':'Big Window ended')}}});
  if(G.slowLeft>0)G.slowLeft--;
  if(rbN('rain')&&s%5===0){var bonus=Math.ceil(coinsBase(s)*2*rbN('rain'));addPurse(bonus);for(var j=0;j<6;j++)coinFly(rr(30,L.W-30),70);floatText('Coin Rain +'+fmt(bonus),L.cx,sy-40,'#7ee8ff',22);Snd.play('coin',s)}
  if(rbN('slow')&&s%10===0){G.slowLeft=3+rbN('slow');requeue();toast('Slow-Mo!')}
  Snd.play('skip',s);if(s%3===0)Snd.play('coin',s);
  var sp=$('#streak');sp.classList.remove('pop');void sp.offsetWidth;sp.classList.add('pop');
  // best + perk unlocks happen live
  var oldBest=P.best;
  if(s>P.best){P.best=s;if(oldBest>0&&!G.newBest&&s>oldBest){G.newBest=true;banner('NEW BEST!',null,'#ff8fb1',1100);Snd.play('new')}else if(oldBest===0&&s>=3)G.newBest=true}
  PERKS.forEach(function(p){if(oldBest<p.at&&P.best>=p.at){G.unl.push(p);perkUnlocked(p)}});
  var wk=worldIdx(s),wNew=false;if(wk!==G.worldK){G.worldK=wk;wNew=true;if(!(PERKAT_HIT(s)||s%100===0||isMilestone(s))){banner('Welcome to '+worldName(wk)+'!',null,'#fff',1500);confetti(40);Snd.play('mile')}else setTimeout(function(){if(G.phase==='run'){banner('Welcome to '+worldName(wk)+'!',null,'#fff',1500);confetti(40)}},2100)}
  if(s%100===0){G.shields++;banner(fmt(s)+' SKIPS!','+1 Second Chance shield','#ffd23d',1500);confetti(90);Snd.play('mile');if(P.up.auto>0&&s%200===0)G.autoCh++}
  else if(isMilestone(s)&&!PERKAT_HIT(s)){banner(fmt(s)+' SKIPS!',null,'#ffd23d',1300);confetti(60);Snd.play('mile')}
  if(s%5===0)saveProfile();
  // milestone: fresh draft + optional Skip Math. Rope pauses while either is open.
  var needMath=P.mathOn&&(isMilestone(s)||s%100===0),needDraft=draftAt(s);
  if(needDraft){G.draft=rollDraft(s);G.picked=false;G.draftNew=true}
  hudUpdate();
  var wantShop=needDraft&&P.shopAuto&&(!G.botOn||G.botShop);
  if(G.phase==='run'&&(needMath||wantShop)){
    setTimeout(function(){
      if(G.phase!=='run'||G.streak<s||document.querySelector('.modal.on'))return;
      if(needMath){G.pendDraft=wantShop;openMath()}else openShop();
    },700);
  }
}
function PERKAT_HIT(s){return PERKS.some(function(p){return p.at===s})}
function perkUnlocked(p){
  banner(p.name+'!','NEW POWERUP UNLOCKED','#7ee8ff',2000);confetti(120);Snd.play('mile');
  setTimeout(function(){toast('Unlocked: '+p.name)},200);saveProfile();
}
function stumble(){
  G.phase='stumble';G.stumbleT=0;setHero('oops');heroEl.classList.remove('tuck');heroEl.classList.add('stumble');
  G.air=false;G.y=0;G.vy=0;Snd.play('stumble');sparkleBurst(L.cx,L.gy-L.ch*.9,10,['#ffe23d','#fff']);
  var s=G.streak;if(s>P.best)P.best=s;
  // banking rule: you KEEP every coin you did not spend; boosts fade away
  G.banked=G.purse;P.coins=Math.min(1e300,P.coins+G.purse);G.purse=0;
  G.lostList=Object.keys(G.rb).map(function(k){return{id:k,n:G.rb[k]}});
  hudUpdate();saveProfile();
}
function endRun(){
  G.phase='over';
  saveProfile();overShow();
  G.rb={};G.tmp={};G.slowLeft=0;
}

var lastNow=0;
function frame(now){
  raf(frame);
  var dt=Math.min(0.05,(now-(lastNow||now))/1000);lastNow=now;
  var sr=$('#s-run');if(!sr||!sr.classList.contains('on')||!cbg)return;
  if(G.paused||document.hidden){return}
  var gdt=dt*TS;
  if(G.phase==='run'){
    G.T+=gdt;
    physics(gdt);
    var st=stats();
    if(G.autoLeft>0){
      G.autoLeft-=gdt;
      for(var i=0;i<G.crosses.length;i++){var c=G.crosses[i];if(!c.auto&&G.T>=c.t-st.H/2&&G.T<c.t+0.1){c.auto=true;if(!G.air){doJump();sparkleBurst(L.cx,L.gy-L.ch*.1,6,['#2fbf4a','#fff'])}break}}
      if(G.autoLeft<=0){G.autoLeft=0;toast('Auto-Skip done!');hudUpdate()}
    }
    if(G.botOn)botStep(st);
    var c0=G.crosses[0];
    if(c0){
      if(G.T>=c0.t-st.grace&&G.T<=c0.t+st.grace&&G.y>=CLEAR)c0.ok=true;
      if(G.T>c0.t+st.grace)resolveCross(c0);
    }
    // whoosh each time the rope swings over the top
    if(G.crosses.length){var ph=ropeState(),turn=Math.floor((ph-Math.PI/2)/(2*Math.PI)),cyc=((ph%(2*Math.PI))+2*Math.PI)%(2*Math.PI);if(cyc<0.18&&ph>2*Math.PI*0.9&&G.lastWhoosh!==G.crosses[0].t){G.lastWhoosh=G.crosses[0].t;Snd.play('whoosh')}}
  }else if(G.phase==='stumble'){
    G.stumbleT+=dt;if(G.stumbleT>1.5)endRun();
    G.T+=gdt*0.3;
  }else if(G.phase==='over'){G.T+=dt}
  placeHero();
  render(dt);
}
function botStep(st){
  if(G.air&&!st.dbl)return;
  for(var i=0;i<G.crosses.length;i++){
    var c=G.crosses[i];if(c.ok||c.bot)continue;
    if(G.T>=c.t-st.H/2-0.005&&G.T<c.t+st.grace){
      if(G.air){if(st.dbl&&!G.hopped&&G.y>0.04){c.bot=true;stageEl.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:7,pointerType:'touch'}))}break}
      c.bot=true;if(G.botSkip>0&&--G.botSkip===0){G.botSkip=-1;break}
      stageEl.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:7,pointerType:'touch'}));break;
    }
    break;
  }
}
function openMath(){
  var lvl=Math.min(5,Math.floor(Math.log10(Math.max(10,G.streak))*1.6)-1);G.mathLevel=lvl;
  var q=mathQ(lvl);G.mq=q;G.mathCoins=Math.max(5,coinsPerSkip(G.streak)*(10+lvl*5));
  $('#mathq').textContent=q.t;$('#mathbonus').innerHTML='Bonus: '+IC.coin()+' '+fmt(G.mathCoins)+' coins! (no pressure)';
  $('#mathmsg').textContent='';
  $('#mathch').innerHTML=q.choices.map(function(c){return '<button class="btn blue" data-ans="'+c+'">'+c+'</button>'}).join('');
  $('#mathm').classList.add('on');syncPause();$('#btn-mathskip').style.display='';Snd.play('ui');
}
function closeMath(){
  $('#mathm').classList.remove('on');
  if(G.pendDraft&&G.phase==='run'){G.pendDraft=false;openShop();return}
  G.pendDraft=false;
  var shift=1.8;G.crosses.forEach(function(c){c.t+=shift;c.bot=false;c.auto=false});G.last+=shift;
  if(G.phase==='run'){banner('Ready?','','#fff',900)}
  syncPause();
}

function nextMile(s){
  var i;for(i=0;i<MILESTONES.length;i++)if(MILESTONES[i]>s)return MILESTONES[i];
  return (Math.floor(s/500)+1)*500;
}
function prevMile(s){var p=0;for(var i=0;i<MILESTONES.length;i++)if(MILESTONES[i]<=s)p=MILESTONES[i];if(s>=1000)p=Math.floor(s/500)*500;return p}
function mileName(n){var p=PERKS.filter(function(x){return x.at===n})[0];return p&&P.best<n?p.name:(p?'milestone':'milestone')}
function hudUpdate(){

function runShopRender(){

/* ---- shop ---- */
function upEffect(id){
  var st=stats();
  if(id==='power')return 'Base coins per skip: '+fmt(1+P.up.power*0.75+0);
  if(id==='hang')return 'Hang time: '+st.H.toFixed(2)+' sec';
  if(id==='lucky')return 'Timing window: '+(st.grace*1000).toFixed(0)+' ms extra';
  if(id==='cm')return 'Coins x'+st.cm.toFixed(2);
  if(id==='auto')return P.up.auto>0?('Lasts '+st.autoDur.toFixed(1)+' sec, '+st.autoCharges+' per run'):'Locked until you buy it';
  return '';
}
function shopRender(){
  $('#shop-coins').innerHTML=IC.coin()+' <b>'+fmt(P.coins)+'</b>';
  $('#shop-back').innerHTML='\u2190 Back';
  var tabs=$$('.tab');var names=[IC.coin()+' Upgrades',IC.star()+' Powerups',IC.hat()+' Closet'],ids=['ups','perks','closet'];
  tabs.forEach(function(t,i){t.innerHTML=names[i];t.classList.toggle('on',ids[i]===shopTab)});
  var h='';
  if(shopTab==='ups'){
    UPS.forEach(function(u){
      var cost=upCost(u.id),can=P.coins>=cost;
      h+='<div class="item"><div class="ico">'+IC[u.icon]()+'</div><div class="txt"><b>'+u.name+'<span class="lvl">Lv '+P.up[u.id]+'</span></b><small>'+u.desc+'</small><small>'+upEffect(u.id)+'</small></div><button class="btn '+(can?'go':'orange')+'" data-buy="'+u.id+'">'+IC.coin()+' '+fmt(cost)+'</button></div>';
    });
    h+='<div class="pill-sec">Bank coins buy FOREVER upgrades. Every level costs a bit more!</div>';
  }else if(shopTab==='perks'){
    var lt=legendTier();
    h+='<div class="pill-sec">Reach a streak to unlock a powerup FOREVER. Best streak: '+fmt(P.best)+'</div>';
    PERKS.forEach(function(p){
      var on=P.best>=p.at;
      h+='<div class="item '+(on?'':'locked')+'" data-perk="'+p.id+'"><div class="ico">'+(on?IC[PERKICON[p.id]]():IC.lock())+'</div><div class="txt"><b>'+p.name+'</b><small>'+(on?p.desc:'Reach '+fmt(p.at)+' skips in a row')+'</small></div><span class="chip" style="font-size:16px;padding:4px 10px">'+(on?'ON':fmt(p.at))+'</span></div>';
    });
    h+='<div class="item"><div class="ico">'+IC.planet()+'</div><div class="txt"><b>Legend Tier '+fmt(lt)+'</b><small>+25% coins per tier. New tier every 1,000 skips after Cosmic!</small></div></div>';
  }else{
    h+='<div class="prev-row"><div class="cprev" id="cprev">'+sullivan({shirt:P.eq.outfit,hat:P.eq.hat,face:'cheer',arms:20})+'</div></div>';
    [['hat','Hats',HATS,function(id){return IC.hat()}],['outfit','Outfits',OUTFITS,function(id){return IC.tee(SHIRTS[id]&&id!=='rainbow'?SHIRTS[id]:'#ff8a1f')}],['rope','Ropes',ROPES,function(id){return IC.ropeI(ROPES[id].col[0])}]].forEach(function(g){
      h+='<div class="pill-sec">'+g[1]+'</div>';
      Object.keys(g[2]).forEach(function(id){
        var t=g[2][id],owned=cosOwned(g[0],id),worn=P.eq[g[0]]===id,cost=t.cost,can=P.coins>=cost;
        var btn=worn?'<button class="btn small" data-wear="'+g[0]+':'+id+'" disabled style="background:#2fbf4a;box-shadow:0 5px 0 #1c8a31">Worn</button>':
          owned?'<button class="btn blue small" data-wear="'+g[0]+':'+id+'">Wear</button>':
          (t.req!==undefined&&!owned?'<span class="chip" style="font-size:14px">Reach '+fmt(t.req)+'</span>':'<button class="btn '+(can?'go':'orange')+' small" data-cbuy="'+g[0]+':'+id+'">'+IC.coin()+' '+fmt(cost)+'</button>');
        h+='<div class="item '+(worn?'mine':'')+'"><div class="ico">'+g[3](id)+'</div><div class="txt"><b>'+t.name+'</b></div>'+btn+'</div>';
      });
    });
  }
  var sb=$('#shop-body'),sc=sb.scrollTop;sb.innerHTML=h;sb.scrollTop=sc;
}

/* ---- settings ---- */
function syncSettings(){
  var s=$('#tog-sound'),m=$('#tog-math'),sh=$('#tog-shop');
  sh.classList.toggle('on',P.shopAuto);sh.textContent=P.shopAuto?'ON':'OFF';sh.setAttribute('aria-checked',String(P.shopAuto));
  s.classList.toggle('on',Snd.on);s.textContent=Snd.on?'ON':'OFF';s.setAttribute('aria-checked',String(Snd.on));
  m.classList.toggle('on',P.mathOn);m.textContent=P.mathOn?'ON':'OFF';m.setAttribute('aria-checked',String(P.mathOn));
}
function openSettings(){syncSettings();$('#settingsm').classList.add('on');syncPause()}
function closeSettings(){$('#settingsm').classList.remove('on');syncPause()}

document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var act=b.getAttribute('data-act');
  if(act){
    Snd.play('ui');
    if(act==='play')startRun();else if(act==='shop'){shopTab='ups';show('shop')}else if(act==='how')show('how');
    else if(act==='home'){show('title')}else if(act==='settings')openSettings();
    return;
  }
  if(b.id==='btn-again'){Snd.play('ui');startRun();return}
  if(b.id==='btn-ov-shop'){Snd.play('ui');$('#over').classList.remove('on');G.phase='idle';shopTab='ups';show('shop');return}
  if(b.id==='btn-ov-home'){Snd.play('ui');$('#over').classList.remove('on');G.phase='idle';show('title');return}
  if(b.classList.contains('tab')){Snd.play('tap');shopTab=b.getAttribute('data-tab');shopRender();return}
  if(b.hasAttribute('data-buy')){
    var id=b.getAttribute('data-buy'),cost=upCost(id);
    if(P.coins>=cost){P.coins-=cost;P.up[id]++;saveProfile();Snd.play('buy');shopRender();toast(UPS.filter(function(u){return u.id===id})[0].name+' level '+P.up[id]+'!')}
    else{Snd.play('no');toast('Skip more to earn '+fmt(cost-P.coins)+' more coins!')}
    return;
  }
  if(b.hasAttribute('data-cbuy')){
    var pr=b.getAttribute('data-cbuy').split(':'),cost2=cosCost(pr[0],pr[1]);
    if(P.coins>=cost2){P.coins-=cost2;P.own[pr[0]][pr[1]]=1;P.eq[pr[0]]=pr[1];saveProfile();Snd.play('buy');shopRender();toast('You got it! Wearing it now!')}
    else{Snd.play('no');toast('Skip more to earn '+fmt(cost2-P.coins)+' more coins!')}
    return;
  }
  if(b.hasAttribute('data-wear')){var w=b.getAttribute('data-wear').split(':');P.eq[w[0]]=w[1];saveProfile();Snd.play('tap');shopRender();return}
  if(b.id==='autobtn'){
    if(G.phase!=='run')return;
    if(G.autoCh<=0){toast('No Auto-Skip! Find one in the SHOP');Snd.play('no');return}
    if(G.autoLeft>0)return;
    G.autoCh--;G.autoLeft=stats().autoDur;Snd.play('auto');banner('AUTO-SKIP!','I got this!','#7ee8ff',900);hudUpdate();return;
  }
  if(b.id==='tog-sound'){Snd.on=!Snd.on;Store.set('sound',Snd.on);syncSettings();Snd.play('tap');return}
  if(b.id==='tog-shop'){P.shopAuto=!P.shopAuto;saveProfile();syncSettings();Snd.play('tap');return}
  if(b.id==='shopbtn'){if(G.phase==='run')openShop();return}
  if(b.id==='btn-shopclose'){Snd.play('ui');closeShop();return}
  if(b.id==='btn-reroll'){rerollDraft();return}
  if(b.hasAttribute('data-pick')){pickDraft(+b.getAttribute('data-pick'));return}
  if(b.hasAttribute('data-now')){buyNow(b.getAttribute('data-now'));return}
  if(b.id==='tog-math'){P.mathOn=!P.mathOn;saveProfile();syncSettings();Snd.play('tap');return}
  if(b.id==='btn-setdone'){Snd.play('ui');closeSettings();return}
  if(b.id==='btn-reset'){Snd.play('tap');$('#settingsm').classList.remove('on');$('#confirmm').classList.add('on');return}
  if(b.id==='btn-reset-no'){Snd.play('ui');$('#confirmm').classList.remove('on');$('#settingsm').classList.add('on');return}
  if(b.id==='btn-reset-yes'){
    resetProfile();$('#confirmm').classList.remove('on');G.phase='idle';G.streak=0;G.purse=0;G.rb={};G.tmp={};$('#over').classList.remove('on');
    mathSeen={};show('title');syncPause();toast('Fresh start! Let\'s skip!');Snd.play('boing');return;
  }
  if(b.hasAttribute('data-ans')){
    var a=+b.getAttribute('data-ans');if(b.disabled)return;
    if(a===G.mq.ans){
      b.classList.add('right');addPurse(G.mathCoins);saveProfile();hudUpdate();Snd.play('good');
      $('#mathmsg').textContent='Yes! +'+fmt(G.mathCoins)+' coins!';confetti(50);
      $$('#mathch .btn').forEach(function(x){x.disabled=true});$('#btn-mathskip').style.display='none';
      setTimeout(closeMath,FAST?300:1100);
    }else{
      b.classList.add('wrong');b.disabled=true;Snd.play('boing');$('#mathmsg').textContent='Not quite - try another!';
    }
    return;
  }
  if(b.id==='btn-mathskip'){Snd.play('tap');closeMath();return}
});
function bindStage(){
  stageEl=$('#stage');
  var f=function(e){e.preventDefault();tapJump()};
  stageEl.addEventListener('pointerdown',f);
  $('#jumpbtn').addEventListener('pointerdown',f);
  document.addEventListener('keydown',function(e){if((e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter')&&!e.repeat&&SCREEN==='run'&&!$('#over').classList.contains('on')&&!document.querySelector('.modal.on')){e.preventDefault();tapJump()}});
}

/* ===== MAIN: boot + test hooks ===== */

  cvBg=$('#cv-bg');cvFx=$('#cv-fx');cbg=cvBg.getContext('2d');cfx=cvFx.getContext('2d');heroEl=$('#hero');shadowEl=$('#hshadow');

  document.addEventListener('visibilitychange',function(){if(document.hidden)saveProfile()});
  window.addEventListener('pagehide',saveProfile);
  show('title');
  raf(frame);
}

  var st=stats(),c0=G.crosses[0];
  return{screen:SCREEN,phase:G.phase,streak:G.streak,best:P.best,life:P.life,coins:P.coins,runCoins:G.runCoins,shields:G.shields,autoCh:G.autoCh,autoLeft:G.autoLeft,
    air:G.air,y:G.y,world:G.worldK,worldName:worldName(G.worldK),perks:PERKS.filter(function(p){return P.best>=p.at}).map(function(p){return p.id}),up:JSON.parse(JSON.stringify(P.up)),
    own:JSON.parse(JSON.stringify(P.own)),eq:JSON.parse(JSON.stringify(P.eq)),mathOn:P.mathOn,sound:Snd.on,storage:Store.mode(),
    H:st.H,hmax:st.hmax,grace:st.grace,cps:coinsPerSkip(G.streak),stats:st,T:G.T,
    nextIn:c0?c0.t-G.T:null,optIn:c0?c0.t-st.H/2-G.T:null,crossType:c0?c0.type:null,queue:G.crosses.map(function(c){return{t:c.t,type:c.type}}),
    paused:G.paused,mathOpen:$('#mathm').classList.contains('on'),overOn:$('#over').classList.contains('on'),runs:P.runs,newBest:G.newBest,unl:G.unl.map(function(p){return p.id}),

    draft:G.draft.map(function(o){var pr=boostPrice(o.id,G.streak,G.buys);return{id:o.id,rarity:BOOSTBY[o.id].r,price:pr,afford:G.purse>=pr,taken:!!o.taken}}),picked:G.picked,draftNew:G.draftNew,buys:G.buys,rerolls:G.rerolls,
    now:BUYNOW.map(function(n){return{id:n.id,price:buyNowPrice(n.id,G.streak,G.buys)}}),rerollPrice:rerollPrice(G.streak,G.rerolls,G.buys),shopAuto:P.shopAuto,lost:G.lostList.map(function(x){return x.id}),
    tempo:tempo(G.streak)*st.ropeSlow,sndLog:Snd.log.slice(-30),mq:G.mq||null,ts:TS,rope:ropeState?(G.crosses.length?ropeState():null):null};
}
window.__SS={
  state:snapshot,
  iconHTML:iconHTML,
  fmt:fmt,coinsPerSkip:coinsPerSkip,upCost:upCost,mathQ:mathQ,mathSeenReset:function(){mathSeen={}},tempo:tempo,worldIdx:worldIdx,worldName:worldName,
  genRun:function(lvl,n){var o=[];for(var i=0;i<n;i++)o.push(mathQ(lvl));return o},
  give:function(n){P.coins+=n;saveProfile();hudUpdate();if(SCREEN==='shop')shopRender()},
  givePurse:function(n){G.purse+=n;G.runCoins+=Math.max(0,n);hudUpdate();if($('#shopm').classList.contains('on'))runShopRender()},
  openShop:openShop,closeShop:closeShop,pick:pickDraft,buyNow:buyNow,reroll:rerollDraft,
  setDraft:function(ids){G.draft=rollDraft(0,ids);G.picked=false;G.draftNew=true;hudUpdate();if($('#shopm').classList.contains('on'))runShopRender()},
  addBoost:function(id,n){for(var i=0;i<(n||1);i++)applyBoost(id);hudUpdate()},
  setBotShop:function(on){G.botShop=!!on},
  boostPrice:boostPrice,buyNowPrice:buyNowPrice,rerollPrice:rerollPrice,draftAt:draftAt,rollDraft:function(s,n){var o=[];for(var i=0;i<n;i++)o.push(rollDraft(s).map(function(x){return x.id}));return o},

  coinsBase:coinsBase,
  setBest:function(n){P.best=n;saveProfile()},
  setLife:function(n){P.life=n;saveProfile()},
  setTS:function(x){TS=x},
  bot:function(on,skipN){G.botOn=!!on;G.botSkip=skipN||0},
  debugStreak:function(n,keepQueue){
    G.streak=n;var oldBest=P.best;if(n>P.best)P.best=n;
    G.worldK=worldIdx(n);G.sinceDbl=0;

  forceMath:function(){openMath()},

boot();

})();
